  <div
  #stage
  class="canvas-stage"
  [class.no-doc]="!hasDocument"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointerleave)="onPointerLeave()"
  (contextmenu)="onContextMenu($event)"
>
  <div #wrap class="canvas-wrap">
    <canvas
      #canvas
      class="main-canvas"
      [class.move-cursor]="tool() === 'moveSelection' || tool() === 'moveObject'"
    ></canvas>
    <canvas #seloverlay class="selection-overlay"></canvas>
    @if (toolPreview(); as tp) {
      <div
        class="tool-preview"
        [class.square]="tp.square"
        [style.left.px]="tp.x"
        [style.top.px]="tp.y"
        [style.width.px]="tp.size"
        [style.height.px]="tp.size"
      ></div>
    }
  </div>
  @if (!hasDocument) {
    <div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
        <path d="M14 2v6h6"/>
      </svg>
      <p>Aucun document ouvert.</p>
      <div class="empty-actions">
        <button (click)="newRequested.emit()">Nouveau document</button>
        <button (click)="openRequested.emit()">Ouvrir une image…</button>
      </div>
    </div>
  }
</div>
