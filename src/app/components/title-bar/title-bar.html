<header
  class="title-bar"
  data-tauri-drag-region
  (dblclick)="toggleMaximize()"
>
  <div class="app-identity" data-tauri-drag-region>
    <img class="logo" src="assets/logo.png" alt="Retouchly" />
    <span class="app-name">Retouchly</span>
  </div>
  <app-menu-bar
    (command)="command.emit($event)"
    [undoEnabled]="undoEnabled"
    [redoEnabled]="redoEnabled"
    [layersEnabled]="layersEnabled"
    [viewRulesChecked]="viewRulesChecked"
    [viewGridChecked]="viewGridChecked"
    [viewNavigatorChecked]="viewNavigatorChecked"
    [currentLang]="currentLang"
  ></app-menu-bar>
  <div class="title-center" data-tauri-drag-region>
    <span>
      {{ doc.document().fileName ?? i18n.t('titleBar.untitled') }}{{ doc.document().dirty ? ' *' : '' }}
    </span>
  </div>
  <div class="title-spacer" data-tauri-drag-region></div>
  <app-window-controls></app-window-controls>
</header>
