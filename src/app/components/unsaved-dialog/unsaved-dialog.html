<div class="dialog-backdrop" (click)="onBackdropClick($event)">
  <div class="dialog">
    <div class="dialog-header">{{ i18n.t('unsaved.title') }}</div>

    <div class="dialog-body">
      <p class="dialog-message">
        {{ i18n.t('unsaved.message') }}
        @if (fileName) {
          <strong>« {{ fileName }} »</strong>
        }
      </p>
    </div>

    <div class="dialog-footer">
      <button class="btn" (click)="onAction('cancel')">{{ i18n.t('unsaved.cancel') }}</button>
      <button class="btn" (click)="onAction('discard')">{{ i18n.t('unsaved.discard') }}</button>
      <button class="btn btn-primary" (click)="onAction('save')">{{ i18n.t('unsaved.save') }}</button>
    </div>
  </div>
</div>
