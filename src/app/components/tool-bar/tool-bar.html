<div class="tool-bar">
  <button class="tool-btn" title="Nouveau document (Ctrl+N)" (click)="command.emit({ id: 'new' })">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
      <path d="M14 2v6h6"/>
    </svg>
  </button>
  <button class="tool-btn" title="Ouvrir une image… (Ctrl+O)" (click)="command.emit({ id: 'open' })">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
  </button>
  <button class="tool-btn" title="Enregistrer (Ctrl+S)" (click)="command.emit({ id: 'save' })">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <path d="M17 21v-8H7v8"/>
      <path d="M7 3v5h8"/>
    </svg>
  </button>
  <button class="tool-btn" title="Enregistrer sous… (Ctrl+Maj+S)" (click)="command.emit({ id: 'saveAs' })">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <path d="M17 21v-8H7v8"/>
      <path d="M15 2v6h6" fill="none"/>
    </svg>
  </button>
  <div class="tool-separator"></div>
  <button class="tool-btn" title="Annuler (Ctrl+Z)" [disabled]="!canUndo" (click)="command.emit({ id: 'undo' })">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 14 4 9l5-5"/>
      <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
    </svg>
  </button>
  <button class="tool-btn" title="Rétablir (Ctrl+Y)" [disabled]="!canRedo" (click)="command.emit({ id: 'redo' })">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m15 14 5-5-5-5"/>
      <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>
    </svg>
  </button>
</div>
