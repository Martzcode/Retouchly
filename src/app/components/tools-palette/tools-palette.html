<div class="tools-palette" role="toolbar" [attr.aria-label]="i18n.t('tools')">
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'brush'"
    [title]="i18n.t('tool.brushTip')"
    (click)="select('brush')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m9.06 11.9 8.07-8.06a2.85 2.83 0 1 1 4.03 4.03l-8.06 8.08"/>
      <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'pencil'"
    [title]="i18n.t('tool.pencilTip')"
    (click)="select('pencil')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'eraser'"
    [title]="i18n.t('tool.eraserTip')"
    (click)="select('eraser')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
      <path d="M22 21H7"/>
      <path d="m5 11 9 9"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'pipette'"
    [title]="i18n.t('tool.pipetteTip')"
    (click)="select('pipette')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m2 22 1.5-5.5L17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22Z"/>
      <path d="m11 8 5 5"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'selectRect'"
    [title]="i18n.t('tool.selectRectTip')"
    (click)="select('selectRect')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="3.5" width="17" height="17" rx="1" stroke-dasharray="4 3"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'selectEllipse'"
    [title]="i18n.t('tool.selectEllipseTip')"
    (click)="select('selectEllipse')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <ellipse cx="12" cy="12" rx="9" ry="6" stroke-dasharray="4 3"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'lasso'"
    [title]="i18n.t('tool.lassoTip')"
    (click)="select('lasso')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3c5 0 9 3.4 9 7.5S17 18 12 18c-2.8 0-5-1.5-5.8-3.6"/>
      <path d="M7.5 12.5a3.5 3.5 0 0 0 .8 6.3"/>
      <path d="M7.5 21.5v-3" stroke-dasharray="2 2"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'wand'"
    [title]="i18n.t('tool.wandTip')"
    (click)="select('wand')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m15 4 5 5"/>
      <path d="m13 6-7 7-1.5 4.5L9 16l7-7z"/>
      <path d="m9.5 14.5 4-4" />
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'moveSelection'"
    [title]="i18n.t('tool.moveSelectionTip')"
    (click)="select('moveSelection')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="5.5" y="5.5" width="13" height="13" rx="1" stroke-dasharray="4 3"/>
      <path d="M9 12h6M12 9v6"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'moveObject'"
    [title]="i18n.t('tool.moveObjectTip')"
    (click)="select('moveObject')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="5.5" y="5.5" width="13" height="13" rx="1" stroke-dasharray="4 3"/>
      <path d="M12 4v16"/>
      <path d="m7 9 5-5 5 5"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'drawShape'"
    [title]="i18n.t('tool.drawShapeTip')"
    (click)="select('drawShape')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <polygon points="12,2 22,9 18,21 6,21 2,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </button>
  <button
    class="tool-btn"
    [class.active]="activeTool() === 'text'"
    [title]="i18n.t('tool.textTip')"
    (click)="select('text')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 4h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</div>
