@if (open) {
  <div class="dialog-backdrop" (click)="cancel()">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3 class="dialog-title">{{ i18n.t('resizeImage.title') }}</h3>
      <div class="dialog-row">
        <label class="dialog-label">
          {{ i18n.t('resizeImage.width') }}
          <input class="dialog-input" type="number" min="1" [(ngModel)]="width" (ngModelChange)="onWidthChange()" />
        </label>
        <label class="lock-ratio">
          <input type="checkbox" [(ngModel)]="lockRatio" />
          <svg viewBox="0 0 16 16" width="14" height="14">
            @if (lockRatio) {
              <rect x="2" y="6" width="12" height="4" rx="1" fill="currentColor" />
              <rect x="1" y="4" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
              <rect x="11" y="4" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
            } @else {
              <rect x="2" y="6" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
            }
          </svg>
        </label>
        <label class="dialog-label">
          {{ i18n.t('resizeImage.height') }}
          <input class="dialog-input" type="number" min="1" [(ngModel)]="height" (ngModelChange)="onHeightChange()" />
        </label>
      </div>
      <div class="dialog-actions">
        <span></span>
        <div class="dialog-actions-right">
          <button class="dialog-btn" (click)="cancel()">{{ i18n.t('dialog.cancel') }}</button>
          <button class="dialog-btn primary" (click)="confirm()">OK</button>
        </div>
      </div>
    </div>
  </div>
}
