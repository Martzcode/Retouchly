<div class="window-controls">
  <button class="wc-btn" [title]="i18n.t('windowControls.minimize')" (click)="minimize()" (dblclick)="$event.stopPropagation()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 12h14"/>
    </svg>
  </button>
  @if (!isMaximized()) {
    <button class="wc-btn" [title]="i18n.t('windowControls.maximize')" (click)="toggleMaximize()" (dblclick)="$event.stopPropagation()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12"/>
      </svg>
    </button>
  } @else {
    <button class="wc-btn" [title]="i18n.t('windowControls.restore')" (click)="toggleMaximize()" (dblclick)="$event.stopPropagation()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="8" width="11" height="11"/>
        <path d="M8 8V5h11v11h-3"/>
      </svg>
    </button>
  }
  <button class="wc-btn wc-close" [title]="i18n.t('windowControls.close')" (click)="close()" (dblclick)="$event.stopPropagation()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
</div>
