<div class="layers-panel">
  <div class="lp-header">{{ i18n.t('layers.title') }}</div>

  <div class="lp-list">
    @for (layer of reversedLayers; track layer.id; let idx = $index) {
      <div
        class="lp-row"
        [class.active]="isActive(layer.id)"
        [class.drag-over]="dropIndex === idx"
        [class.dragging]="dragIndex === idx"
        (click)="setActive(layer.id)"
        (dblclick)="startRename(layer.id, layer.name)"
        draggable="true"
        (dragstart)="onDragStart(idx, $event)"
        (dragover)="onDragOver(idx, $event)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop(idx, $event)"
        (dragend)="onDragEnd()"
      >
        @if (editingId() === layer.id) {
          <input
            class="lp-name-input"
            [value]="editName()"
            (input)="onNameInput($event, layer.id)"
            (keydown)="onNameKeydown($event, layer.id)"
            (blur)="commitRename(layer.id)"
            autofocus
          />
        } @else {
          <span class="lp-name">{{ layer.name }}</span>
        }

        <canvas class="lp-thumb" [width]="48" [height]="48"></canvas>
        <img class="lp-thumb-img" [src]="thumbUrl(layer.id)" width="48" height="48" />

        <button
          class="lp-eye"
          [class.hidden]="!layer.visible"
          (click)="toggleVisibility(layer.id, layer.visible); $event.stopPropagation()"
          [title]="i18n.t('layers.visibility')"
          [textContent]="layer.visible ? '👁' : '—'"
        ></button>

        <button
          class="lp-lock"
          [class.locked]="layer.locked"
          (click)="toggleLock(layer.id, layer.locked); $event.stopPropagation()"
          [title]="i18n.t('layers.lock')"
          [textContent]="layer.locked ? '🔒' : '🔓'"
        ></button>
      </div>
    }
  </div>

  @if (activeLayer(); as active) {
    <div class="lp-props">
      <div class="lp-prop-row">
        <label>{{ i18n.t('layers.opacity') }}</label>
        <input
          type="range"
          min="0"
          max="100"
          [value]="active.opacity"
          (input)="onOpacityInput($event)"
        />
        <span>{{ active.opacity }}%</span>
      </div>
      <div class="lp-prop-row">
        <label>{{ i18n.t('layers.mode') }}</label>
        <select [value]="active.blendMode" (change)="onBlendModeChange(active.id, $event)">
          @for (mode of blendModes; track mode) {
            <option [value]="mode" [selected]="mode === active.blendMode">{{ blendLabel(mode) }}</option>
          }
        </select>
      </div>
      <div class="lp-prop-row">
        <label>{{ i18n.t('layers.rotation') }}</label>
        <input
          type="range"
          min="-180"
          max="180"
          [value]="active.rotation"
          (change)="onRotationChange(active.id, $event)"
        />
        <span>{{ active.rotation }}°</span>
      </div>
      <div class="lp-prop-row">
        <label>{{ i18n.t('layers.scale') }}</label>
        <input
          type="range"
          min="10"
          max="500"
          [value]="active.scale"
          (change)="onScaleChange(active.id, $event)"
        />
        <span>{{ active.scale }}%</span>
      </div>
      <div class="lp-prop-row">
        <button class="lp-btn-inline" (click)="onResetTransform(active.id)" [disabled]="active.rotation === 0 && active.scale === 100">
          {{ i18n.t('layers.resetTransform') }}
        </button>
      </div>
    </div>
  }

  <div class="lp-actions">
    <button class="lp-btn" (click)="onCommand('addLayer')" [title]="i18n.t('layers.newLayer')" [disabled]="!layers.hasDocument">＋</button>
    <button class="lp-btn" (click)="onCommand('duplicateLayer')" [title]="i18n.t('layers.duplicate')" [disabled]="!layers.hasDocument">⧉</button>
    <button class="lp-btn" (click)="onCommand('deleteLayer')" [title]="i18n.t('layers.delete')" [disabled]="!layers.hasDocument">🗑</button>
    <span class="lp-sep"></span>
    <button class="lp-btn" (click)="onCommand('moveLayerUp')" [title]="i18n.t('layers.up')" [disabled]="!layers.hasDocument">▲</button>
    <button class="lp-btn" (click)="onCommand('moveLayerDown')" [title]="i18n.t('layers.down')" [disabled]="!layers.hasDocument">▼</button>
    <span class="lp-sep"></span>
    <button class="lp-btn" (click)="onCommand('mergeDown')" [title]="i18n.t('layers.mergeDown')" [disabled]="!layers.hasDocument">⊟</button>
    <button class="lp-btn" (click)="onCommand('flattenImage')" [title]="i18n.t('layers.flatten')" [disabled]="!layers.hasDocument">▤</button>
  </div>
</div>
