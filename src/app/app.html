<div class="app-shell">
  <app-title-bar
    (command)="onCommand($event)"
    [undoEnabled]="canvas.canUndo()"
    [redoEnabled]="canvas.canRedo()"
    [layersEnabled]="canvas.hasDocument"
    [viewRulesChecked]="canvas.showRules()"
    [viewGridChecked]="canvas.showGrid()"
    [viewNavigatorChecked]="canvas.showNavigator()"
    [currentLang]="i18n.lang()"
  ></app-title-bar>
  <app-tool-bar
    (command)="onCommand($event)"
    [canUndo]="canvas.canUndo()"
    [canRedo]="canvas.canRedo()"
  ></app-tool-bar>
  <app-tool-options></app-tool-options>
  <main class="workspace">
    <app-tools-palette></app-tools-palette>
    <app-canvas
      (positionChange)="onCanvasPosition($event)"
      (dirty)="onCanvasDirty()"
      (newRequested)="onNew()"
      (openRequested)="onOpen()"
      (zoomChange)="onCanvasZoom($event)"
    ></app-canvas>
    <aside class="right-panels">
      <app-layers-panel
        (command)="onCommand($event)"
        (opacityChange)="onLayerOpacityChange($event)"
        (compositeNeeded)="canvas.compositeToDisplay()"
      ></app-layers-panel>
      <app-colors-panel></app-colors-panel>
    </aside>
  </main>
  <app-status-bar
    [position]="cursorPos"
    [document]="doc.document()"
    [error]="doc.error()"
    [zoom]="zoom()"
    [tool]="toolLabel()"
  ></app-status-bar>
  @if (showNewDialog()) {
    <app-new-image-dialog
      (confirm)="onNewConfirm($event)"
      (cancel)="onNewCancel()"
    ></app-new-image-dialog>
  }
  <app-adjustment-dialog
    [type]="adjType()"
    [open]="showAdjDialog()"
    (closed)="onAdjClose()"
    (previewChange)="canvas.compositeToDisplay()"
  ></app-adjustment-dialog>
  <app-effects-dialog
    [type]="fxType()"
    [open]="showFxDialog()"
    (closed)="onFxClose()"
    (previewChange)="canvas.compositeToDisplay()"
  ></app-effects-dialog>
  <app-resize-image-dialog
    [open]="showResizeImageDialog()"
    (confirmed)="onResizeImageConfirm($event)"
    (cancelled)="onResizeImageCancel()"
  ></app-resize-image-dialog>
  <app-resize-canvas-dialog
    [open]="showResizeCanvasDialog()"
    (confirmed)="onResizeCanvasConfirm($event)"
    (cancelled)="onResizeCanvasCancel()"
  ></app-resize-canvas-dialog>
  @if (showAboutDialog()) {
    <div class="about-backdrop" (click)="showAboutDialog.set(false)">
      <div class="about-dialog" (click)="$event.stopPropagation()">
        <svg class="about-logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" fill="#2563eb"/>
          <rect x="10" y="8.5" width="4" height="7" rx="2" transform="rotate(-20 12 12)" fill="#ffcd42"/>
          <path d="M8.5 16 6 13.5l-1 1 3.5 3.5L14 12.5l-1-1-4.5 4.5z" fill="#ef4444"/>
          <circle cx="17" cy="7" r="1.4" fill="#34d399"/>
          <circle cx="6.5" cy="7.5" r="1.1" fill="#f43f5e"/>
        </svg>
        <h2>Retouchly</h2>
        <p class="about-version">{{ i18n.t('about.version') }}</p>
        <p class="about-desc">{{ i18n.t('about.description') }}</p>
        <p class="about-credit">{{ i18n.t('about.credit') }} <a href="https://github.com/Martzcode" target="_blank" rel="noopener">Martzcode</a></p>
        <button class="about-close" (click)="showAboutDialog.set(false)">{{ i18n.t('about.close') }}</button>
      </div>
    </div>
  }
</div>
