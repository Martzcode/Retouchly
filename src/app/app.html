<div class="app-shell">
  <app-title-bar (command)="onCommand($event)"></app-title-bar>
  <app-tool-bar (command)="onCommand($event)"></app-tool-bar>
  <app-tool-options></app-tool-options>
  <main class="workspace">
    <app-tools-palette></app-tools-palette>
    <app-canvas
      (positionChange)="onCanvasPosition($event)"
      (dirty)="onCanvasDirty()"
      (newRequested)="onNew()"
      (openRequested)="onOpen()"
      (zoomChange)="onCanvasZoom($event)"
    ></app-canvas>
  </main>
  <app-status-bar
    [position]="cursorPos"
    [document]="doc.document()"
    [error]="doc.error()"
    [zoom]="zoom()"
    [tool]="toolLabel()"
  ></app-status-bar>
</div>
