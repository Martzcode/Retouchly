[package]
name = "retouchly"
version = "0.1.0"
description = "Retouchly - application de retouche d'image type Paint.NET"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
