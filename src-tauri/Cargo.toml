[package]
name = "retouchly"
version = "26.8.9"
description = "Retouchly - application de retouche d'image type Paint.NET"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gobject-sys = "0.18"
glib = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
